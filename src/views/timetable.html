<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <%- include("include/header.html") %>
    <title>Timetable</title>
</head>
<body>
    <div class="container-sm mt-2">
        <h1 class="text-center">My Timetable</h1>

        <div class="row mb-3">
            <div class="col-md-4">
                <div class="d-flex">
                    <input id="timetableName" class="form-control" type="text" />
                    <button id="saveChangeBtn" class="btn btn-primary ms-2">Set</button>
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="table-responsive">
                <table class="table table-bordered" id="timetableTable">
                    <thead>
                        <th>Time</th>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                    </thead>

                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="row mb-3">
            <div id="colourOptions"></div>
        </div>
    </div>
    
    <%- include("include/footer.html") %>
</body>
<script src="/js/pages/myTimetable.js?v=<%= appVersion %>"></script>
</html>
