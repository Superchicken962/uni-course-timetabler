<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <%- include("include/header.html") %>
    <title>My Courses</title>
</head>
<body>
    <div class="container-sm mt-2">
        <h1 class="text-center">My Courses</h1>

        <div class="row mb-3 mt-3">
            <div class="table-responsive">
                <table class="table table-bordered table-striped" id="courseTable">
                    <thead>
                        <th>ID</th>
                        <th>Area</th>
                        <th>Name</th>
                        <th>Coordinator</th>
                        <th>Level of Study</th>
                        <th>Unit Value</th>
                        <th>Campus</th>
                        <th>Owner</th>
                        <th>University Wide Elective Course</th>
                        <th>Work Integrated Learning Course</th>
                        <th></th>
                    </thead>
    
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="row mb-3">
            <h3>Add Course</h3>
            
            <div class="col-md-4">
                <div class="d-flex">
                    <input id="addCourseInput" class="form-control" placeholder="Course ID or URL..."/>
                    <button id="addCourseBtn" class="btn btn-outline-success ms-2">Add</button>
                </div>
            </div>
        </div>
    </div>
    
    <%- include("include/footer.html") %>
</body>
<script src="/js/pages/myCourses.js?v=<%= appVersion%>"></script>
</html>
